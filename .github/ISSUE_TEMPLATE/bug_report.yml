name: Report a problem
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: WaveType version
      description: Settings → General → About.
      placeholder: "0.2.42"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Air M2"
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Dictation
        - Voice notes
        - Meetings
        - Text cleanup
        - Downloadable models
        - Settings
        - Updates
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened. Don't include API keys or private text.
    validations:
      required: true
